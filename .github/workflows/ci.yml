name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [macos-14]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build ruff
      - run: ruff check .
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m build
      - run: zsh -n install.sh
      - run: zsh -n "Install Claude Session Sync.command"
