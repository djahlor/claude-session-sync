name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [macos-14]
        python-version: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build ruff
      - run: ruff check .
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Compile bundled sidebar helper
        if: matrix.python-version == '3.13'
        run: |
          PYTHONPATH=src python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          from claude_session_sync.installer import InstallLayout, Installer

          with tempfile.TemporaryDirectory() as directory:
              layout = InstallLayout.for_home(Path(directory))
              helper = Path(directory) / "layoutdb"
              Installer(layout)._stage_layout_helper(helper)
              result = subprocess.run(
                  [str(helper)], text=True, capture_output=True
              )
              assert result.returncode == 2
              assert "usage: layoutdb" in result.stderr
          PY
      - name: Test real installer artifacts in an isolated home
        if: matrix.python-version == '3.13'
        env:
          RUN_MACOS_INSTALLER_INTEGRATION: "1"
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_installer_integration.py -v
      - run: python -m build
      - name: Check wheel is self-contained
        run: |
          wheel_root="$RUNNER_TEMP/claude-session-sync-wheel"
          python -m pip install --no-deps --target "$wheel_root" dist/*.whl
          PYTHONPATH="$wheel_root" python -c 'from claude_session_sync.cli import main; raise SystemExit(main())' --config "$RUNNER_TEMP/test-config.json" setup --automatic-targets --sync-layout --sync-routines --dry-run
      - run: zsh -n install.sh
      - run: zsh -n get.sh
      - run: zsh -n "Install Claude Session Sync.command"
      - run: zsh -n scripts/closed-sync-test.sh
      - run: zsh -n scripts/closed-sync-test.command
