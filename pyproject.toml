[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-sync"
dynamic = ["version"]
description = "Keep Claude Desktop Code chats, groups, routines and built-in browser logins in sync across accounts on one Mac."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Djahlor"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/djahlor/claude-session-sync"
Changelog = "https://github.com/djahlor/claude-session-sync/blob/main/CHANGELOG.md"
Issues = "https://github.com/djahlor/claude-session-sync/issues"

[project.scripts]
claude-session-sync = "claude_session_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "claude_session_sync.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_session_sync = [
  "SessionSyncWatcher.swift",
  "layoutdb.cc",
  "vendor/README.md",
  "vendor/leveldb/LICENSE",
  "vendor/leveldb/db/*.cc",
  "vendor/leveldb/db/*.h",
  "vendor/leveldb/table/*.cc",
  "vendor/leveldb/table/*.h",
  "vendor/leveldb/util/*.cc",
  "vendor/leveldb/util/*.h",
  "vendor/leveldb/port/*.cc",
  "vendor/leveldb/port/*.h",
  "vendor/leveldb/include/leveldb/*.h",
  "vendor/snappy/COPYING",
  "vendor/snappy/snappy/*.cc",
  "vendor/snappy/snappy/*.h",
  "vendor/snappy/mac/*.h",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
# mypy cannot target 3.9; CI still runs the tests on 3.9.
python_version = "3.10"
files = ["src/claude_session_sync"]

[[tool.mypy.overrides]]
# 11 known errors, all optional LevelDB values used after a check. Next to clear.
module = "claude_session_sync.layout"
ignore_errors = true
