[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-sync"
version = "0.2.0"
description = "Safely synchronize Claude Desktop Code session history across explicitly configured local profiles."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Djahlor"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.scripts]
claude-session-sync = "claude_session_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claude_session_sync = ["SessionSyncWatcher.swift"]
